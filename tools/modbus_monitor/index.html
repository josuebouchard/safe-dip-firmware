<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modbus Monitor</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2; --surface: #fcfcfb; --border: #e2e1dc;
    --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984; --grid: #ebeae6;
    --x: #2a78d6; --y: #eb6834;
    --good: #1a8a3a; --bad: #d03b3b; --idle: #c9c8c2; --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111110; --surface: #1a1a19; --border: #2e2e2c;
      --text: #ffffff; --text-2: #c3c2b7; --muted: #8a8984; --grid: #262624;
      --x: #3987e5; --y: #d95926;
      --good: #3fb55f; --bad: #e66767; --idle: #3a3a37; --accent: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end;
           padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  h1 { font-size: 16px; margin: 0 16px 6px 0; }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--text-2); gap: 2px; }
  input { font: inherit; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
          background: var(--bg); color: var(--text); width: 9em; }
  input.num { width: 6em; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
           background: var(--surface); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #status { margin-left: auto; font-size: 13px; color: var(--text-2); display: flex; gap: 8px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); display: inline-block; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr));
         gap: 16px; padding: 16px; }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; min-width: 0; }
  section.wide { grid-column: 1 / -1; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--text-2);
       text-transform: uppercase; letter-spacing: .04em; }
  .lamps { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .lamp { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border);
          border-radius: 8px; }
  .lamp .dot { width: 14px; height: 14px; }
  .lamp b { font-weight: 500; }
  .lamp small { margin-left: auto; color: var(--muted); }
  .readout { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 8px; }
  .readout div { font-size: 12px; color: var(--text-2); }
  .readout span { display: block; font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  svg text { fill: var(--text-2); font-size: 11px; }
  .stages { display: flex; flex-wrap: wrap; gap: 10px; }
  .stage { flex: 1 1 auto; }
  .stage > div:first-child { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .ops { display: flex; gap: 4px; }
  .op { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px;
        font-family: ui-monospace, monospace; white-space: nowrap; color: var(--text-2); }
  .op.done { color: var(--muted); }
  .op.current { background: var(--accent); border-color: var(--accent); color: #fff; }
  .op.failed { background: var(--bad); border-color: var(--bad); color: #fff; }
  .chart { position: relative; }
  canvas { width: 100%; height: 150px; display: block; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
         border-radius: 6px; padding: 4px 8px; font-size: 12px; display: none; white-space: nowrap;
         font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { font-size: 12px; color: var(--text-2); font-weight: 500; }
  td.n { font-variant-numeric: tabular-nums; }
  tr.off td { color: var(--muted); }
  tr.first td:first-child { font-weight: 600; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Modbus Monitor</h1>
  <label>IP address <input id="host" value="192.168.1.100"></label>
  <label>Port <input id="port" class="num" type="number" min="1" max="65535" value="502"></label>
  <label>Refresh (ms) <input id="rate" class="num" type="number" min="50" step="50" value="200"></label>
  <button id="connect" class="primary">Connect</button>
  <div id="status"><span class="dot" id="link"></span><span id="statusText">Disconnected</span></div>
</header>

<main>
  <section class="wide">
    <h2>Discrete inputs</h2>
    <div class="lamps" id="lamps"></div>
  </section>

  <section class="wide">
    <h2>Faults</h2>
    <div id="faultHint" class="readout"></div>
    <table>
      <thead><tr><th>Bit</th><th>Fault</th><th>State</th><th>Source</th></tr></thead>
      <tbody id="faults"></tbody>
    </table>
  </section>

  <section>
    <h2>Gantry</h2>
    <div class="readout">
      <div><i class="sw" style="background:var(--x)"></i>X position<span id="xv">—</span></div>
      <div><i class="sw" style="background:var(--y)"></i>Y position<span id="yv">—</span></div>
      <div>Operation<span id="opv">—</span></div>
    </div>
    <svg id="gantry" viewBox="0 0 460 240" width="100%" role="img" aria-label="Gantry position"></svg>
  </section>

  <section>
    <h2>Position history (60 s)</h2>
    <div class="chart"><canvas id="cx" aria-label="X position over time"></canvas><div class="tip"></div></div>
    <div class="chart"><canvas id="cy" aria-label="Y position over time"></canvas><div class="tip"></div></div>
  </section>

  <section class="wide">
    <h2>Cycle</h2>
    <div class="stages" id="stages"></div>
  </section>

  <section class="wide">
    <h2>Parameters (holding registers)</h2>
    <table>
      <thead><tr><th>Addr</th><th>Name</th><th>Value</th><th>Range</th><th>Set</th></tr></thead>
      <tbody id="params"></tbody>
    </table>
    <div id="writeErr" class="err"></div>
  </section>
</main>

<script>
// Mirrors the board's Modbus map
const LAMPS = [
  ["e_stop", "E-stop", "bad"], ["start", "Start", "good"], ["running", "Running", "good"],
  ["x_at_target", "X at target", "good"], ["y_at_target", "Y at target", "good"],
  ["effector", "Effector engaged", "good"], ["fault", "Fault", "bad"],
];
const STAGES = [
  ["Home", ["MOVE_Y_UP", "MOVE_X_HOME"]],
  ["Pick", ["MOVE_Y_DOWN", "EFFECTOR_ENGAGE", "MOVE_Y_UP"]],
  ["Dip", ["MOVE_X_DIP", "MOVE_Y_DOWN", "DWELL", "MOVE_Y_UP"]],
  ["Deposit", ["MOVE_X_OUTPUT", "MOVE_Y_DOWN"]],
  ["Release", ["EFFECTOR_DISENGAGE", "MOVE_Y_UP"]],
];
const OPS = STAGES.flatMap(([, ops]) => ops);
const PARAMS = [
  ["X input position", "steps", 1000], ["X dip position", "steps", 1000],
  ["X output position", "steps", 1000], ["Y up position", "steps", 500],
  ["Y down position", "steps", 500], ["Dwell time", "ms", 60000],
];
const NO_SOURCE = 0xFFFF;
const opSource = (v) => `Operation ${v} · ${OPS[v] ?? "?"}`;
const RESET_FLAGS = [
  [1, "brownout"], [2, "reset pin"], [3, "power-on"], [4, "software"],
  [5, "independent watchdog"], [6, "window watchdog"], [7, "low power"],
];
const resetSource = (v) => RESET_FLAGS.filter(([bit]) => v & (1 << bit)).map(([, name]) => name).join(", ");
// In bit order, which is also the order of the source registers.
const FAULTS = [
  ["E-stop", null], ["Operation interrupted", opSource], ["Operation timed out", opSource],
  ["Operation failed", opSource], ["Home switch stuck", opSource], ["Position drift", opSource],
  ["Unexpected reset", resetSource],
];
const HISTORY_MS = 60000;

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (n) => n.toLocaleString();

// session changes on every connect/disconnect, so a poll still in flight
// from an old session is dropped instead of rendering or rescheduling.
let timer = null, session = 0, history = [];

// --- static DOM ---
$("lamps").innerHTML = LAMPS.map(([k, name]) =>
  `<div class="lamp"><span class="dot" id="l_${k}"></span><b>${name}</b><small id="t_${k}">—</small></div>`).join("");

let opIdx = 0;
$("stages").innerHTML = STAGES.map(([stage, ops]) =>
  `<div class="stage"><div>${stage}</div><div class="ops">${
    ops.map((op) => `<span class="op" id="op_${opIdx++}">${op}</span>`).join("")}</div></div>`).join("");

$("faults").innerHTML = FAULTS.map(([name], i) =>
  `<tr id="f_${i}"><td class="n">${i}</td><td>${name}</td><td id="fs_${i}">—</td><td id="fv_${i}">—</td></tr>`).join("");

$("params").innerHTML = PARAMS.map(([name, unit, max], i) =>
  `<tr><td class="n">${i}</td><td>${name}</td><td class="n" id="p_${i}">—</td><td class="n">0–${fmt(max)} ${unit}</td>
   <td><input class="num" type="number" min="0" max="${max}" id="w_${i}"> <button data-i="${i}">Write</button></td></tr>`).join("");

// --- connection ---
const target = () => `host=${encodeURIComponent($("host").value.trim())}&port=${encodeURIComponent($("port").value)}`;

function setStatus(state, text) {
  $("link").style.background = { ok: css("--good"), err: css("--bad"), idle: css("--idle") }[state];
  $("statusText").textContent = text;
  $("statusText").className = state === "err" ? "err" : "";
}

async function tick(s) {
  const rate = Math.max(50, +$("rate").value || 200);
  try {
    const r = await fetch(`/api/poll?${target()}`);
    const d = await r.json();
    if (s !== session) return;
    if (!r.ok) throw new Error(d.error);
    render(d);
    setStatus("ok", `Connected · ${d.latency_ms} ms`);
  } catch (e) {
    if (s !== session) return;
    setStatus("err", `Error: ${e.message}`);
  }
  timer = setTimeout(() => tick(s), rate);
}

$("connect").onclick = () => {
  if (timer) {
    clearTimeout(timer); timer = null; session++;
    fetch("/api/disconnect", { method: "POST" });
    $("connect").textContent = "Connect"; $("connect").className = "primary";
    setStatus("idle", "Disconnected");
  } else {
    history = [];
    const s = ++session;
    timer = setTimeout(() => tick(s), 0);
    $("connect").textContent = "Disconnect"; $("connect").className = "";
    setStatus("idle", "Connecting…");
  }
};

$("params").onclick = async (ev) => {
  const i = ev.target.dataset.i;
  if (i === undefined) return;
  const value = $(`w_${i}`).value;
  $("writeErr").textContent = "";
  try {
    const r = await fetch(`/api/write?${target()}&address=${i}&value=${value}`, { method: "POST" });
    if (!r.ok) throw new Error((await r.json()).error);
  } catch (e) {
    $("writeErr").textContent = `Write ${PARAMS[i][0]} failed: ${e.message}`;
  }
};

// --- render ---
function render(d) {
  const now = performance.now();
  history.push({ t: now, x: d.x, y: d.y });
  while (history.length && history[0].t < now - HISTORY_MS) history.shift();

  for (const [k, , on] of LAMPS) {
    $(`l_${k}`).style.background = d[k] ? css(`--${on}`) : css("--idle");
    $(`t_${k}`).textContent = d[k] ? "ON" : "off";
  }
  $("xv").textContent = fmt(d.x);
  $("yv").textContent = fmt(d.y);
  $("opv").textContent = `${d.op_index} · ${OPS[d.op_index] ?? "?"}`;

  const failedOp = FAULTS.findIndex(([, source], i) => source === opSource && d.fault_sources[i] !== NO_SOURCE);
  OPS.forEach((_, i) => {
    const isFailed = failedOp !== -1 && i === d.fault_sources[failedOp];
    $(`op_${i}`).className = "op" + (isFailed ? " failed" : i === d.op_index ? (d.running ? " current" : "") : i < d.op_index ? " done" : "");
  });
  renderFaults(d);
  d.params.forEach((v, i) => {
    $(`p_${i}`).textContent = fmt(v);
    const w = $(`w_${i}`);
    if (document.activeElement !== w && w.value === "") w.placeholder = v;
  });

  drawGantry(d);
  drawChart($("cx"), "x", "--x", "X (steps)");
  drawChart($("cy"), "y", "--y", "Y (steps)");
}

function renderFaults(d) {
  FAULTS.forEach(([, source], i) => {
    const bit = 1 << i;
    const isLatched = (d.faults_active & bit) !== 0;
    const isFirst = d.fault_first === bit;
    $(`f_${i}`).className = !isLatched ? "off" : isFirst ? "first" : "";
    $(`fs_${i}`).textContent = !isLatched ? "clear" : isFirst ? "Latched, first" : "Latched";
    $(`fs_${i}`).className = isLatched ? "err" : "";
    const value = d.fault_sources[i];
    $(`fv_${i}`).textContent = isLatched && source && value !== NO_SOURCE ? source(value) : "—";
  });
  $("faultHint").textContent = !d.fault ? "No faults latched."
    : d.e_stop ? "Release the e-stop, then press start to clear."
    : "Press start to clear, then press it again to restart the cycle.";
}

function drawGantry(d) {
  const [xIn, xDip, xOut, yUp, yDown] = d.params;
  // Scale to whatever is largest: configured limits, stations, or where the axis actually is.
  const xMax = Math.max(1000, xIn, xDip, xOut, Math.abs(d.x));
  const yMax = Math.max(500, yUp, yDown, Math.abs(d.y));
  const L = 30, R = 440, T = 30, B = 200;
  const sx = (v) => L + (v / xMax) * (R - L);
  const sy = (v) => T + (v / yMax) * (B - T);
  const cx = sx(d.x), cy = sy(d.y);
  const stations = [[xIn, "input"], [xDip, "dip"], [xOut, "output"]];
  $("gantry").innerHTML = `
    <line x1="${L}" x2="${R}" y1="${T - 12}" y2="${T - 12}" stroke="${css("--muted")}" stroke-width="4" stroke-linecap="round"/>
    ${[[yUp, "up"], [yDown, "down"]].map(([v, n]) => `
      <line x1="${L}" x2="${R}" y1="${sy(v)}" y2="${sy(v)}" stroke="${css("--y")}" stroke-dasharray="3 4" opacity=".6"/>
      <text x="${R + 4}" y="${sy(v) + 4}">${n}</text>`).join("")}
    ${stations.map(([v, n]) => `
      <rect x="${sx(v) - 22}" y="${B + 6}" width="44" height="22" rx="4" fill="none" stroke="${css("--x")}" opacity=".7"/>
      <text x="${sx(v)}" y="${B + 22}" text-anchor="middle">${n}</text>`).join("")}
    <line x1="${cx}" x2="${cx}" y1="${T - 12}" y2="${cy}" stroke="${css("--text-2")}" stroke-width="3"/>
    <rect x="${cx - 12}" y="${T - 20}" width="24" height="16" rx="3" fill="${css("--x")}"/>
    <circle cx="${cx}" cy="${cy}" r="9" fill="${d.running ? css("--y") : css("--idle")}" stroke="${css("--surface")}" stroke-width="2"/>
    <text x="${L}" y="${T - 22}">0</text><text x="${R}" y="${T - 22}" text-anchor="end">${fmt(xMax)}</text>`;
}

function drawChart(canvas, key, color, title) {
  const dpr = devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext("2d");
  g.scale(dpr, dpr);
  g.clearRect(0, 0, w, h);
  const L = 52, R = w - 8, T = 18, B = h - 18;
  const now = history.length ? history[history.length - 1].t : 0;
  const vals = history.map((p) => p[key]);
  let lo = Math.min(0, ...vals), hi = Math.max(1, ...vals);
  const sx = (t) => R - ((now - t) / HISTORY_MS) * (R - L);
  const sy = (v) => B - ((v - lo) / (hi - lo)) * (B - T);

  g.font = "11px system-ui"; g.fillStyle = css("--text-2"); g.strokeStyle = css("--grid"); g.lineWidth = 1;
  g.fillText(title, L, 12);
  for (const v of [lo, (lo + hi) / 2, hi]) {
    g.beginPath(); g.moveTo(L, sy(v)); g.lineTo(R, sy(v)); g.stroke();
    g.textAlign = "right"; g.fillText(fmt(Math.round(v)), L - 6, sy(v) + 4); g.textAlign = "left";
  }
  g.fillText("−60 s", L, h - 4); g.textAlign = "right"; g.fillText("now", R, h - 4); g.textAlign = "left";

  g.strokeStyle = css(color); g.lineWidth = 2; g.lineJoin = "round"; g.beginPath();
  history.forEach((p, i) => (i ? g.lineTo : g.moveTo).call(g, sx(p.t), sy(p[key])));
  g.stroke();
  canvas._scale = { sx, sy, key, color, title };
}

// Crosshair tooltip: nearest sample to the pointer
for (const canvas of [$("cx"), $("cy")]) {
  const tip = canvas.nextElementSibling;
  canvas.onpointermove = (ev) => {
    const s = canvas._scale;
    if (!s || !history.length) return;
    const x = ev.offsetX;
    const p = history.reduce((a, b) => Math.abs(s.sx(b.t) - x) < Math.abs(s.sx(a.t) - x) ? b : a);
    const ago = ((history[history.length - 1].t - p.t) / 1000).toFixed(1);
    tip.textContent = `${fmt(p[s.key])} steps · −${ago} s`;
    tip.style.display = "block";
    tip.style.left = Math.min(s.sx(p.t) + 8, canvas.clientWidth - tip.offsetWidth) + "px";
    tip.style.top = Math.max(0, s.sy(p[s.key]) - 28) + "px";
    const g = canvas.getContext("2d");
    drawChart(canvas, s.key, s.color, s.title);
    g.strokeStyle = css("--muted"); g.lineWidth = 1;
    g.beginPath(); g.moveTo(s.sx(p.t), 18); g.lineTo(s.sx(p.t), canvas.clientHeight - 18); g.stroke();
    g.fillStyle = css(s.color);
    g.beginPath(); g.arc(s.sx(p.t), s.sy(p[s.key]), 4, 0, 7); g.fill();
  };
  canvas.onpointerleave = () => (tip.style.display = "none");
}

// Remember the target between sessions
for (const id of ["host", "port", "rate"]) {
  try { const v = localStorage.getItem(`mbm_${id}`); if (v) $(id).value = v; } catch {}
  $(id).onchange = () => { try { localStorage.setItem(`mbm_${id}`, $(id).value); } catch {} };
}
</script>
</body>
</html>
